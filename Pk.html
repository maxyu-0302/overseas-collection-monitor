function render(){refreshModes();const map={overview,stages,targets,businessGoals,forecastParams,daily:pkDailyConclusion,other,quality,reproduce:quality};$('sections').innerHTML=note('主监控总计及业务目标为M2＋M3；全月实收预估包含M4等账龄，二者范围不同。部分账龄成本尚未覆盖。')+map[active]();$('mode').disabled=active==='other';if(active==='forecastParams'){$('param-use-legacy').onclick=()=>{const old=priorForecastOverride();if(!old){$('param-state').textContent='无可用旧版覆盖';return}params={...old.values};manualParams=Object.fromEntries(Object.keys(defaults).map(k=>[k,true]));paramsSaved=false;render()};for(const k of Object.keys(defaults))$('param-'+k).oninput=e=>{const v=e.target.valueAsNumber;params[k]=v;manualParams[k]=true;paramsSaved=false;$('param-state').textContent='未保存；仅本次页面有效';const f=forecastNow();$('param-preview').innerHTML=parameterPreview(f);for(const age of ['M2','M3']){const r=f.rows.find(x=>x.group===age)||{},rate=Number.isFinite(params[age])&&r.current_rate!=null?r.current_rate+params[age]/100:null;$('method-'+age).textContent=!manualParams[age]?('10月增量（来源公式）'):'手动覆盖';$('rate-'+age).textContent=pct(rate,4);$('amount-'+age).textContent=fmt(Number.isFinite(r.prediction)?r.prediction/fx('2026-11'):null)}};$('param-save').onclick=()=>{if(!Object.values(params).every(Number.isFinite)){ $('param-state').textContent='请输入有效数字';return}try{localStorage.setItem(parameterKey,JSON.stringify({values:params,manual:manualParams,source:ASOF}));overrideSource=ASOF;paramsSaved=true;$('param-state').textContent='已保存到本机；覆盖来源日期 '+overrideSource}catch(e){$('param-state').textContent='保存失败'}};$('param-reset').onclick=()=>{try{localStorage.removeItem(parameterKey);params={...defaults};manualParams={};paramsSaved=true;overrideSource='';render()}catch(e){$('param-state').textContent='恢复失败，请检查浏览器存储'}}}if(active==='targets')pkPeopleBind(render);if(active==='daily')pkDailyBind(render);$('quality-badge').textContent='截至'+ASOF.slice(5)+' · '+($('mode').value==='低触达'?'低触达单列':'常规范围');}
function go(id){active=id;for(const el of document.querySelectorAll('#nav button'))el.classList.toggle('active',el.dataset.page===id);$('page-title').textContent=pages.find(p=>p[0]===id)[1];render();window.scrollTo({top:0});}
function reset(){for(const id of ['stage','mode'])$(id).value='';humanScenario=defaultTargetTier;$('human-scenario').value=humanScenario;$('denom').value='overdue';$('currency').value='CNY';cohortBand='';cohortScore='';render();}
function download(text,name,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCurrent(){if(!csvRows.length){$('toast').textContent='本栏目暂无可导出的表格';$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800);return}const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s)&&!/^[-+]?\d/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download('\ufeff'+[csvHeaders,...csvRows].map(r=>r.map(safe).join(',')).join('\r\n'),'巴基斯坦_'+pages.find(p=>p[0]===active)[1]+'_'+ASOF.replaceAll('-','')+'.csv','text/csv;charset=utf-8');}
$('human-scenario').value=humanScenario;
$('human-scenario').onchange=e=>{humanScenario=e.target.value;render()};$('nav').innerHTML=pages.filter(([id])=>id!=='businessGoals').map(([id,name],i)=>`<button data-page="${id}"><span>${String(id==='reproduce'?9:i+1).padStart(2,'0')}</span>${name}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.page)};for(const id of ['stage','mode','target','denom','currency'])$(id).onchange=render;$('reset').onclick=reset;$('export').onclick=exportCurrent;$('print').onclick=()=>window.print();$('close').onclick=closeDrawer;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active==='targets'&&pkPeopleOpen){pkPeopleOpen=false;render();$('pk-group-toggle').focus()}else if(e.key==='Escape')closeDrawer()});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='tree'){treeOpen.has(v)?treeOpen.delete(v):treeOpen.add(v);render()}if(a==='treeall'){treeOpen.clear();if(v==='open')for(const age of ['M2','M3','M4']){treeOpen.add(age);treeOpen.add(age+'|人催');treeOpen.add(age+'|非人催');treeOpen.add(age+'|人催归属待核');if(age==='M4')for(const mode of [...new Set(m4ActualRows().map(r=>r.mode))])for(const kind of ['人催归属待核'])treeOpen.add(age+'|'+kind+'|'+mode)}render()}if(a==='trend'){trendPage=v;render()}if(a==='age'){$('stage').value=v;go('stages')}if(a==='mode')openMode(v);if(a==='queue')openQueue(v);if(a==='agequeue'){const [age,q]=v.split(' | ');openQueue(q,age)}});$('dateline').textContent='2026年11月 · 数据截至'+ASOF+' · 对比10月同期';$('foot-version').textContent='PK_V2_'+ASOF.replaceAll('-','')+' · M2两线目标 · 巴基斯坦独立口径';go('overview');

const chartTip=document.createElement('div');chartTip.id='chart-tip';chartTip.setAttribute('role','tooltip');document.body.appendChild(chartTip);document.addEventListener('pointermove',e=>{const z=e.target.closest('[data-chart-tip]');if(!z){chartTip.style.display='none';return}chartTip.textContent=z.dataset.chartTip;chartTip.style.display='block';chartTip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-300))+'px';chartTip.style.top=Math.max(8,Math.min(e.clientY+12,innerHeight-chartTip.offsetHeight-12))+'px'});
</script></body></html>
